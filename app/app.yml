profile:
  label: "AgentOps Monitoring"
  description: "Real-time monitoring dashboard for Cortex Agent and Semantic View performance"
  icon: icon.svg

install:
  commands:
    - ["npm", "ci", "--include=dev"]

run:
  command: ["node", ".next/standalone/server.js"]
  env:
    SNOWFLAKE_DATABASE: BABY_MART_DEMO
    SNOWFLAKE_SCHEMA: AGENTOPS
    SNOWFLAKE_WAREHOUSE: RETAIL_AI_EVAL_WH
    SNOWFLAKE_ROLE: ACCOUNTADMIN
